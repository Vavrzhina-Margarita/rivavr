<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="A local-first film-inspired photo editor by Rivavr.">
  <title>Rivavr Memory Lab — Film-inspired photo editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Rivavr Memory Lab home">
      <span class="brand-mark">R</span><span class="brand-name">RIVAVR MEMORY LAB</span>
    </a>
    <div class="project"><i></i><span id="fileStatus">NO IMAGE LOADED</span></div>
    <div class="top-actions">
      <label class="text-btn open-image" for="imageInput">Open image <span>↗</span></label>
      <button class="text-btn" id="resetBtn" disabled>Reset</button>
      <button class="download-btn" id="downloadPng" disabled>PNG <span>↓</span></button>
      <button class="download-btn primary" id="downloadJpg" disabled>JPEG <span>↓</span></button>
    </div>
  </header>

  <main>
    <section class="lab-layout">
      <aside class="controls-panel">
        <section class="presets-section" aria-label="Choose a photo style">
          <div class="section-title"><h2>Looks</h2></div>
          <div class="look-tabs" role="tablist" aria-label="Look collection">
            <button class="look-tab active" id="filmTab" type="button" role="tab" aria-selected="true">Film</button>
            <button class="look-tab" id="effectsTab" type="button" role="tab" aria-selected="false">Effects</button>
          </div>
          <div class="preset-grid" id="presetGrid"></div>
        </section>
        <div class="control-header"><div><h2>Adjust</h2><p class="preset-current" id="activePresetName">Family snapshot <span>1998</span></p></div></div>
        <p class="control-description" id="presetDescription">Warm indoor flash, soft highlights, and mellow family-album color.</p>
        <div class="control-list" id="controlList"></div>
      </aside>

      <div class="stage-column">
        <section class="photo-stage" id="photoStage" aria-label="Photo preview">
          <div class="empty-state" id="emptyState">
            <h2>Bring a photo into the lab</h2>
            <label class="upload-button" for="imageInput">Choose a photo <span>↗</span></label>
          </div>
          <div class="image-frame hidden" id="imageFrame">
            <canvas id="processedCanvas"></canvas>
            <canvas id="originalCanvas"></canvas>
            <span id="captionName" hidden></span>
            <div class="wipe-line hidden" id="wipeLine"></div>
            <button class="compare-toggle" id="compareBtn" disabled>Hold to see original</button>
          </div>
          <div class="spotlight-tip hidden" id="spotlightTip">Click the subject to place the light</div>
          <label class="stage-upload hidden" for="imageInput" id="stageUpload">Change photo</label>
          <button class="focus-toggle" id="focusToggle" type="button" aria-pressed="false" aria-label="Show photo full screen" disabled><span>Full screen</span> <i>↗</i></button>
          <input id="imageInput" type="file" accept="image/*" hidden>
        </section>
        <div class="stage-footer">
          <span id="previewStatus">Ready when you are</span>
          <button class="before-after" id="viewOriginal" disabled>View original</button>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
